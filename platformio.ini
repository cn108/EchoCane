; EchoCane - PlatformIO project
;
; The hardware-independent application logic lives in firmware/lib/echocane_core
; and is compiled for both the Arduino Nano and a native host target.

[platformio]
default_envs = nanoatmega328
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
test_dir = firmware/test

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; Keep the project warning-clean without turning framework warnings into errors.
build_flags =
    -Wall
    -Wextra
    -Wpedantic
lib_ldf_mode = deep+
test_ignore = test_core

[env:native]
platform = native
test_framework = unity
; Only the portable core library and the tests are compiled for the host.
test_build_src = no
lib_ldf_mode = deep+
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
